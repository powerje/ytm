name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install just swiftlint
      - name: Toolchain
        run: swift --version
      - name: Check, build and test
        run: just precommit
